name: Python CI with Auto Docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # для деплоя на GitHub Pages
    
    steps:
    # --- Тестирование ---
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov sphinx sphinx-rtd-theme
        
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v
        
    - name: Run with coverage
      run: |
        python -m pytest tests/ --cov=src --cov-report=term-missing
        
    # --- Документация ---
    - name: Initialize documentation structure
      run: |
        # Создаем структуру директорий если их нет
        mkdir -p docs/source
        mkdir -p docs/_build
        
    - name: Generate Sphinx configuration
      run: |
        # Создаем минимальную конфигурацию Sphinx
        cat > docs/source/conf.py << 'EOF'
        import os
        import sys
        sys.path.insert(0, os.path.abspath('../..'))
        
        project = 'Ваш Проект МАИ'
        author = 'Свешников Е.В.'
        release = '1.0'
        
        extensions = [
            'sphinx.ext.autodoc',
            'sphinx.ext.viewcode',
            'sphinx.ext.napoleon',
        ]
        
        html_theme = 'sphinx_rtd_theme'
        html_static_path = ['_static']
        EOF
        
    - name: Create main documentation page
      run: |
        cat > docs/source/index.rst << 'EOF'
        Документация проекта
        ====================
        
        Автоматически сгенерированная документация для проекта по ТРПО.
        
        Описание проекта
        ----------------
        
        Этот проект был создан в рамках практической работы №2 по дисциплине
        "Технологии разработки программного обеспечения" в МАИ.
        
        CI/CD процесс настроен с использованием GitHub Actions.
        
        Структура проекта
        -----------------
        
        .. toctree::
           :maxdepth: 2
           :caption: Содержание:
           
           modules
        
        Автор: Свешников Е.В.
        Группа: М30-106СВ-25
        Кафедра: 304 "Вычислительные машины, системы и сети"
        EOF
        
    - name: Generate API documentation from source code
      run: |
        # Автоматически генерируем документацию из исходного кода
        sphinx-apidoc -o docs/source src/ --force
        
    - name: Build HTML documentation
      run: |
        sphinx-build -b html docs/source docs/_build/html
        
    # --- Деплой документации на GitHub Pages ---
    - name: Deploy documentation to GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
